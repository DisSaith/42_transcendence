name: dessin_rapide

services:

  backend:
    container_name: backend
    build: ./src/backend
    networks:
        - back_net
    ports:
        - "3000:3000"
    restart: always
      
  postgresql:
    container_name: postgresql
    build: ./src/postgresql
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - back_net
    restart: always
    env_file: .env

networks:
  back_net:
    driver: bridge

volumes:
  postgresql_data:
